<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b3382e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" rx="16" fill="#faf8f5"/>
  <text x="340" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#8c2620">急性胸痛评估路径（示意）</text>

  <rect x="240" y="52" width="200" height="46" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.2"/>
  <text x="340" y="80" text-anchor="middle" font-size="14" fill="#2b2b2f">急性胸痛 / 胸闷不适</text>

  <line x1="340" y1="98" x2="340" y2="124" stroke="#b3382e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="196" y="126" width="288" height="46" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.2"/>
  <text x="340" y="154" text-anchor="middle" font-size="14" fill="#2b2b2f">10 分钟内：心电图 + 生命体征 + 问诊</text>

  <line x1="340" y1="172" x2="340" y2="192" stroke="#b3382e" stroke-width="1.5" marker-end="url(#arr)"/>

  <polygon points="340,194 470,238 340,282 210,238" fill="#f7ebe9" stroke="#b3382e" stroke-width="1.2"/>
  <text x="340" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#8c2620">ST 段抬高？</text>

  <path d="M 232 258 L 150 320" fill="none" stroke="#b3382e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="288" font-size="13" font-weight="600" fill="#8c2620">是</text>
  <path d="M 448 258 L 530 320" fill="none" stroke="#b3382e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="512" y="288" font-size="13" font-weight="600" fill="#8c2620">否</text>

  <rect x="30" y="322" width="240" height="58" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.2"/>
  <text x="150" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#8c2620">STEMI：立即再灌注</text>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#5c5c66">PCI 目标 ≤90 分钟 / 溶栓 ≤30 分钟</text>

  <rect x="410" y="322" width="240" height="58" rx="10" fill="#ffffff" stroke="#b3382e" stroke-width="1.2"/>
  <text x="530" y="346" text-anchor="middle" font-size="13" font-weight="600" fill="#8c2620">NSTEMI / 不稳定心绞痛</text>
  <text x="530" y="368" text-anchor="middle" font-size="12" fill="#5c5c66">动态肌钙蛋白 + 危险分层；排除夹层 / 肺栓塞 / 气胸</text>

  <text x="340" y="394" text-anchor="middle" font-size="11" fill="#888780">示意图 · 仅供科普参考，实际诊疗以急救流程与医嘱为准</text>
</svg>
