  <h1>冠心病支架术后，怎么动才安全？</h1>
  <div class="meta">孟自力 · 主任医师 · 2026-10-16 · 阅读约 5 分钟</div>
  <p class="lead">"支架都放完了，是不是以后就得静养、不能运动了？"——这是支架术后患者最常问的问题之一。答案恰恰相反：按时吃药是地基，科学运动才是让血管"长治久安"的钥匙。</p>

  <div class="article">
    <h2>一、先说清楚：支架不是"免死金牌"</h2>
    <p>支架解决的，只是冠状动脉里"最狭窄的那一段"。它并没有消除动脉粥样硬化的"土壤"——全身的血管、尤其是没放支架的血管，依然可能继续长斑块。所以支架术后，真正决定长期预后的，是后面这五件事：按时服药、戒烟、控好三高、规律运动、定期复查。</p>

    <h2>二、术后运动，分阶段来</h2>
    <p>多数患者术后 1–2 天即可在床上活动、逐步下床；出院后的运动要"循序渐进、处方化"。一个通俗的参考分法：</p>
    <div class="phases">
      <div class="ph"><b>第一阶段（术后 1–2 周）</b>：以散步为主，每次 10–15 分钟，每天 1–2 次，以不胸闷、不喘为度。</div>
      <div class="ph"><b>第二阶段（术后 2–8 周）</b>：逐步延长到每次 20–30 分钟、每周 4–5 次，以快走、慢跑、骑车等有氧为主。</div>
      <div class="ph"><b>第三阶段（稳定期）</b>：可加入力量训练（弹力带、轻量器械），强度参照"运动时能说话但不能唱歌"的适中强度。</div>
    </div>

    <h2>三、比"动不动"更重要的是"怎么动"</h2>
    <ul>
      <li><strong>首选有氧</strong>：快走、慢跑、骑车、游泳、太极拳——对心血管最友好。</li>
      <li><strong>强度自测</strong>：用"说话试验"——运动时还能成句说话、但不轻松唱歌，强度就合适；若一句话都说不完整，说明过量。</li>
      <li><strong>时间地点</strong>：避开清晨低温与空气污染重时段；随身携带急救药（如硝酸甘油，遵医嘱）。</li>
      <li><strong>热身与放松</strong>：运动前后各 5–10 分钟，避免骤起骤停。</li>
    </ul>

    <h2>四、这些信号，立刻停下并就医</h2>
    <ul>
      <li>运动中或运动后胸痛、胸闷、压迫感；</li>
      <li>莫名心悸、头晕、眼前发黑、出冷汗；</li>
      <li>呼吸困难明显加重。</li>
    </ul>
    <p>出现上述任何一项，停止活动、原地休息，若不缓解立即拨打 120。</p>

    <div class="note"><strong>关键建议：</strong>最稳妥的做法是参加正规的<strong>心脏康复计划</strong>——在医生指导下，通过运动负荷评估制定个体化方案，并在监护下训练。这比"自己瞎练"安全得多，获益也明确。本文为科普，具体运动处方请结合您的造影结果、心功能与合并病，由心脏康复团队或主诊医生制定。</div>
